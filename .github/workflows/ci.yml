name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Preparar Java 25 e Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Construir e empacotar a aplicação
        run: mvn --batch-mode --no-transfer-progress package

      - name: Guardar o JAR gerado
        uses: actions/upload-artifact@v4
        with:
          name: api-cliente-jar
          path: target/api-cliente-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
